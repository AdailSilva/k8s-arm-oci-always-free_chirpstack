# =====================================================================
#  Service do frontend
# =====================================================================
apiVersion: v1
kind: Service
metadata:
  name: app-chirpstack-manager-frontend-service
  namespace: chirpstack-manager
spec:
  type: ClusterIP
  selector:
    app: app-chirpstack-manager-frontend-deployment
    component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
