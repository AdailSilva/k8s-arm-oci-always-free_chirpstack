# =====================================================================
#  Frontend (Angular + NGINX). O NGINX encaminha /api para o backend.
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-chirpstack-manager-frontend-deployment
  namespace: chirpstack-manager
  labels:
    app: app-chirpstack-manager-frontend-deployment
    component: frontend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app-chirpstack-manager-frontend-deployment
      component: frontend
  template:
    metadata:
      labels:
        app: app-chirpstack-manager-frontend-deployment
        component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: app-chirpstack-manager-frontend-platform-linux-arm64
          image: <OCI_REGISTRY_URL>/<OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE>/app-chirpstack-manager-frontend_platform_linux-arm64:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # O NGINX (nginx.conf da imagem) encaminha /api para http://api-chirpstack-manager-backend-service:8083.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
      imagePullSecrets:
        - name: oci-registry-secret
