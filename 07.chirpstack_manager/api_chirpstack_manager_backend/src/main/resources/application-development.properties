# ===============================================================
# = Application settings
# ===============================================================
spring.application.name=chirpstack-manager
# development: maquina do desenvolvedor, H2 em arquivo, sem HTTPS
# Padrao de portas:
#   development 8081 (frontend 4201) | staging 8082 (4202) | production 8083 (4203)
#   actuator/probes 8084 em todos os perfis (fora do Service e do Ingress)

# ===============================================================
# = Server settings
# ===============================================================
#server.address=localhost (Do not uncomment when deploying to Docker or Kubernetes)
# Prefixo de todas as rotas da API (padrão dos backends do cluster). O NGINX do frontend
# encaminha /api/... para /chirpstack-manager/api/...; o actuator (porta 8084) não usa o prefixo.
server.servlet.context-path=/chirpstack-manager/
server.address=0.0.0.0
server.port=${SERVER_PORT:8081}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
# native = Tomcat RemoteIpValve: so confia no X-Forwarded-For vindo de proxies internos (Ingress, NGINX)
server.forward-headers-strategy=native

# Threads virtuais (Java 21): cada requisicao ao ChirpStack nao prende uma thread de plataforma
spring.threads.virtual.enabled=true

# ===============================================================
# = Upload (restauracao de backup: o maior upload aceito pela API)
# ===============================================================
spring.servlet.multipart.max-file-size=${APP_BACKUP_MAX_UPLOAD:512MB}
spring.servlet.multipart.max-request-size=${APP_BACKUP_MAX_UPLOAD:512MB}

# ===============================================================
# = DATA SOURCE / HikariCP
# ===============================================================
# H2 em arquivo (./data), modo PostgreSQL: os dados sobrevivem ao restart.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/chirpstack-manager;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.hikari.pool-name=ChirpStackManagerPool-Dev
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# ===============================================================
# = JPA / HIBERNATE
# ===============================================================
# Estrutura criada SOMENTE pelas migrations do Flyway; o Hibernate apenas valida.
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
# OSIV (Open Session in View)
spring.jpa.open-in-view=false

# ===============================================================
# = Flyway
# ===============================================================
spring.flyway.enabled=true
spring.flyway.encoding=UTF-8
# Bancos criados antes da V06/V10 aplicam essas versoes "no meio" sem falhar a validacao.
spring.flyway.out-of-order=true
spring.flyway.locations=classpath:/db/migration/H2

# ===============================================================
# = Actuator (Kubernetes Probes)
# ===============================================================
# Porta de gerenciamento SEPARADA, 8084 em todos os perfis: as probes chamam /actuator/health/*
# aqui, e o actuator fica fora do Service e do Ingress.
management.server.port=${MANAGEMENT_PORT:8084}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# liveness = so a JVM (queda do banco nao reinicia o pod);
# readiness = JVM + banco (o pod sai do Service enquanto o PostgreSQL estiver fora)
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# ===============================================================
# = Fuso horario
# ===============================================================
# Grade do backup automatico, nomes dos arquivos e indicadores de visitantes
app.fuso-horario=${APP_TIMEZONE:America/Fortaleza}

# ===============================================================
# = ChirpStack v4 - REST API (chirpstack-rest-api v4.19)
# ===============================================================
app.chirpstack.base-url=${CHIRPSTACK_BASE_URL:https://chirpstack-v4-rest-api.adailsilva.com.br}
# API key de ADMIN gerada no ChirpStack (Network Server > API keys). Nunca vai para o navegador.
app.chirpstack.api-token=${CHIRPSTACK_API_TOKEN:}
app.chirpstack.connect-timeout=5s
app.chirpstack.read-timeout=30s
# Limite maximo de itens por pagina aceito pelo backend
app.chirpstack.max-page-size=1000

# ===============================================================
# = MQTT do ChirpStack v4 (integracao MQTT, eventos em JSON)
# ===============================================================
# Broker interno do ChirpStack v4 (Mosquitto, TLS na 8883). Usuario e senha vem do Secret
# api-chirpstack-manager-secret (copiados de chirpstack-v4-mqtt-credentials pelo script 07).
app.mqtt.habilitado=${MQTT_HABILITADO:false}
app.mqtt.url=${MQTT_URL:ssl://localhost:8883}
app.mqtt.usuario=${MQTT_USERNAME:}
app.mqtt.senha=${MQTT_PASSWORD:}
# CA do broker (PEM). Vazio = confia nas CAs da JVM.
app.mqtt.ca-arquivo=${MQTT_CA_FILE:}
app.mqtt.client-id=${MQTT_CLIENT_ID:chirpstack-manager}
# Eventos de todas as aplicacoes: up, join, status, ack, txack, log, location, integration
app.mqtt.topico=${MQTT_TOPICO:application/+/device/+/event/+}
app.mqtt.qos=1

# ===============================================================
# = Retencao das leituras
# ===============================================================
# Leituras e eventos mais antigos que isso sao apagados toda madrugada (03:50).
app.retencao.leituras-dias=${APP_RETENCAO_LEITURAS_DIAS:180}
# Dispositivo sem mensagem ha mais que isso aparece como "sem comunicacao".
app.retencao.sem-comunicacao-minutos=${APP_SEM_COMUNICACAO_MINUTOS:60}

# ===============================================================
# Fila de comandos (downlinks): padrao da politica de novas tentativas
# ===============================================================
# Tentativas por comando, intervalo entre elas (s) e fator de recuo
# (intervalo x recuo^(n-1)); espera pela prova de execucao depois da
# transmissao (s) e validade do comando (min). Cada comando pode trazer
# a propria politica. Ciclo da fila em ms.
app.comandos.max-tentativas=${APP_COMANDOS_MAX_TENTATIVAS:5}
app.comandos.intervalo-tentativa-s=${APP_COMANDOS_INTERVALO_S:300}
app.comandos.fator-recuo=${APP_COMANDOS_FATOR_RECUO:1.5}
app.comandos.aguardar-resposta-s=${APP_COMANDOS_AGUARDAR_S:300}
app.comandos.validade-min=${APP_COMANDOS_VALIDADE_MIN:1440}
app.comandos.ciclo-ms=${APP_COMANDOS_CICLO_MS:15000}

# ===============================================================
# = E-mail (conta de envio)
# ===============================================================
# A conta (usuario, senha de app, remetente) e editada na tela Sistema > Conta de e-mail e fica
# no banco, cifrada. Aqui so o servidor SMTP e os padroes usados quando a tela ainda nao foi salva.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:codeinserver@gmail.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
# Endereco publico do painel (links de redefinicao de senha nos e-mails)
app.url-publica=${APP_URL_PUBLICA:http://localhost:4201}

# ===============================================================
# = JWT (sessao do painel)
# ===============================================================
# Segredo HS256 com pelo menos 32 caracteres. OBRIGATORIO em producao (Secret K8s).
app.security.jwt-secret=${APP_JWT_SECRET:}
app.security.jwt-issuer=chirpstack-manager
app.security.access-token-ttl=${APP_ACCESS_TOKEN_TTL:15m}
app.security.refresh-token-ttl=${APP_REFRESH_TOKEN_TTL:7d}

# ===============================================================
# = Login - protecao contra forca bruta
# ===============================================================
app.security.max-login-attempts=5
app.security.lockout-duration=15m

# ===============================================================
# = CORS e cookie do refresh token
# ===============================================================
# Origens liberadas no CORS (separadas por virgula)
app.security.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4201}
# Cookie do refresh token so trafega em HTTPS (false apenas sem HTTPS: development e staging)
app.security.cookie-secure=${APP_COOKIE_SECURE:false}

# ===============================================================
# = Administrador inicial (usado SOMENTE com a tabela de usuarios vazia)
# ===============================================================
# Credenciais iniciais fixas: admin@chirpstack.com.br / chirpstack. No primeiro acesso a API
# exige a troca da senha (a nova segue a regra de senha forte) antes de liberar o resto.
# Admin ja existente no banco nao e alterado.
app.security.bootstrap-admin-email=${APP_ADMIN_EMAIL:admin@chirpstack.com.br}
app.security.bootstrap-admin-password=${APP_ADMIN_PASSWORD:chirpstack}

# ===============================================================
# = Cifragem de segredos (Google Drive e conta de e-mail no banco)
# ===============================================================
# Chave AES-256 (openssl rand -base64 32). Sem ela, a chave e derivada do APP_JWT_SECRET.
app.security.chave-cifragem=${APP_CHAVE_CIFRAGEM:}

# ===============================================================
# = Sessoes (visitantes e controle de logoff)
# ===============================================================
# A politica (inatividade, duracao maxima, sessoes simultaneas) e editada na tela
# Sistema > Controle de sessao e fica no banco. Aqui, so a retencao do historico.
app.sessao.retencao-historico-dias=${APP_SESSAO_RETENCAO_DIAS:365}

# ===============================================================
# = Backup e restauracao do banco do painel
# ===============================================================
# Volume dos backups (subpastas manuais/, agendados/ e seguranca/)
app.backup.diretorio=${APP_BACKUP_DIR:./data/backups}
app.backup.prefixo-arquivo=chirpstack-manager_database
app.backup.tempo-limite=${APP_BACKUP_TEMPO_LIMITE:30m}
app.backup.historico-dias=180

# ===============================================================
# = Backup no Google Drive (OAuth 2.0, escopo drive.file)
# ===============================================================
# As credenciais tambem podem ser cadastradas na tela (Backup > Google Drive), que tem prioridade.
app.google-drive.client-id=${GOOGLE_DRIVE_CLIENT_ID:}
app.google-drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
# Endereco PUBLICO do callback; cadastre-o igual no cliente OAuth do Google Cloud
app.google-drive.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:4201/api/v1/backup/google-drive/callback}
app.google-drive.retorno-frontend=/sistema/backup
app.google-drive.pasta-padrao=ChirpStack/Manager

# ===============================================================
# = Loggers
# ===============================================================
logging.level.br.com.adailsilva.chirpstackmanager=DEBUG
logging.level.org.hibernate=INFO
logging.level.com.zaxxer.hikari=INFO
