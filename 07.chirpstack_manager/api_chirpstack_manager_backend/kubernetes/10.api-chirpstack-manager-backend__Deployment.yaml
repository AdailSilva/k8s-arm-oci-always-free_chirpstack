# =====================================================================
#  Deployment do backend (Spring Boot). A API key do ChirpStack só existe aqui.
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-chirpstack-manager-backend-deployment
  namespace: chirpstack-manager
  labels:
    app: api-chirpstack-manager-backend-deployment
    component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # Recreate: só um pod da API por vez gravando backups e rodando pg_dump.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api-chirpstack-manager-backend-deployment
      component: backend
  template:
    metadata:
      labels:
        app: api-chirpstack-manager-backend-deployment
        component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        # Dono dos arquivos do volume de backups
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api-chirpstack-manager-backend-platform-linux-arm64
          image: <OCI_REGISTRY_URL>/<OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE>/api-chirpstack-manager-backend_platform_linux-arm64:latest
          imagePullPolicy: Always
          # 8083 = aplicação (perfil production) | 8084 = actuator/probes (management.server.port),
          # A 8084 não entra no Service nem no Ingress.
          ports:
            - name: backend-port
              containerPort: 8083
            - name: management-port
              containerPort: 8084
          # Configuracao em linha (sem ConfigMap da API); segredos
          # do Secret unico api-chirpstack-manager-secret (02).
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: production
            - name: CHIRPSTACK_BASE_URL
              value: https://chirpstack-v4-rest-api.adailsilva.com.br
            # Monitoramento: eventos dos dispositivos no MQTT do ChirpStack v4
            - name: MQTT_HABILITADO
              value: "true"
            - name: MQTT_URL
              value: ssl://chirpstack-v4-mosquitto-service.chirpstack-v4.svc.cluster.local:8883
            - name: MQTT_CA_FILE
              value: /etc/chirpstack-manager/mqtt/ca.crt
            - name: APP_URL_PUBLICA
              value: https://app-chirpstack-manager.adailsilva.com.br
            - name: MAIL_USERNAME
              value: codeinserver@gmail.com
            - name: APP_CORS_ALLOWED_ORIGINS
              value: https://app-chirpstack-manager.adailsilva.com.br
            - name: APP_ADMIN_EMAIL
              value: admin@chirpstack.com.br
            - name: APP_COOKIE_SECURE
              value: "true"
            - name: DB_URL
              value: jdbc:postgresql://api-chirpstack-manager-postgresql-service.chirpstack-manager.svc.cluster.local:5449/chirpstack_manager_database?sslmode=disable
            - name: DB_USERNAME
              value: chirpstack_manager_role
            - name: APP_TIMEZONE
              value: America/Fortaleza
            - name: APP_BACKUP_DIR
              value: /var/backups/chirpstack-manager
            - name: APP_BACKUP_MAX_UPLOAD
              value: 512MB
            - name: GOOGLE_DRIVE_REDIRECT_URI
              value: https://app-chirpstack-manager.adailsilva.com.br/api/v1/backup/google-drive/callback
            - name: CHIRPSTACK_API_TOKEN
              valueFrom: { secretKeyRef: { name: api-chirpstack-manager-secret, key: CHIRPSTACK_API_TOKEN } }
            - name: MQTT_USERNAME
              valueFrom: { secretKeyRef: { name: api-chirpstack-manager-secret, key: MQTT_USERNAME, optional: true } }
            - name: MQTT_PASSWORD
              valueFrom: { secretKeyRef: { name: api-chirpstack-manager-secret, key: MQTT_PASSWORD, optional: true } }
            - name: APP_JWT_SECRET
              valueFrom: { secretKeyRef: { name: api-chirpstack-manager-secret, key: APP_JWT_SECRET } }
            - name: APP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: api-chirpstack-manager-secret, key: APP_ADMIN_PASSWORD } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: api-chirpstack-manager-secret, key: POSTGRESQL_PASSWORD } }
            - name: APP_CHAVE_CIFRAGEM
              valueFrom: { secretKeyRef: { name: api-chirpstack-manager-secret, key: APP_CHAVE_CIFRAGEM, optional: true } }
            - name: GOOGLE_DRIVE_CLIENT_ID
              valueFrom: { secretKeyRef: { name: api-chirpstack-manager-secret, key: GOOGLE_DRIVE_CLIENT_ID, optional: true } }
            - name: GOOGLE_DRIVE_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: api-chirpstack-manager-secret, key: GOOGLE_DRIVE_CLIENT_SECRET, optional: true } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: backups
              mountPath: /var/backups/chirpstack-manager
            - name: mqtt-ca
              mountPath: /etc/chirpstack-manager/mqtt
              readOnly: true
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: management-port }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: management-port }
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: management-port }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
      volumes:
        # /tmp também recebe o arquivo enviado para restauração e os backups enviados só ao Drive
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        - name: backups
          persistentVolumeClaim:
            claimName: oci-fss-pvc-chirpstack-manager
        # CA do broker MQTT do ChirpStack v4 (copiada pelo script 07)
        - name: mqtt-ca
          secret:
            secretName: api-chirpstack-manager-mqtt-ca
            optional: true
      imagePullSecrets:
        - name: oci-registry-secret
