# ==============================================================================
#  MODELO do Secret do ChirpStack Manager -- NAO versionar com valores reais.
#
#  POR QUE ESTE E O 02 (logo depois do Namespace)
#  ---------------------------------------------------------------------------
#  O primeiro consumidor deste Secret e o proprio PostgreSQL (05):
#  POSTGRES_SUPERUSER_PASSWORD vira a senha do usuario postgres na inicializacao
#  do volume, e POSTGRESQL_PASSWORD e a senha com que o script de inicializacao
#  (04) cria o chirpstack_manager_role. O que um manifesto consome vem antes dele.
#
#  SECRET UNICO
#  ---------------------------------------------------------------------------
#  Todas as chaves da API e do PostgreSQL ficam neste Secret (a API nao tem
#  ConfigMap proprio).
#
#  O objeto abaixo fica COMENTADO de proposito: um `kubectl apply -f` neste
#  arquivo (ou na pasta inteira) nao pode sobrescrever o Secret real do cluster
#  com os placeholders. O pipeline nunca aplica este arquivo.
#
#  Quem cria cada chave (todos idempotentes, um `kubectl patch` por chave):
#    00.create_secret_api-chirpstack-manager_script.sh       restaura o backup do 02.destroy (se o Secret nao existir)
#    06.criar_secret_senha_banco_api-chirpstack-manager_script.sh   POSTGRESQL_PASSWORD, POSTGRES_SUPERUSER_PASSWORD
#    07.gerar_segredos_aplicacao_api-chirpstack-manager_script.sh   APP_*, CHIRPSTACK_API_TOKEN, MQTT_*, GOOGLE_DRIVE_* e a CA do MQTT
#
#  Chaves:
#    POSTGRESQL_PASSWORD          senha do chirpstack_manager_role (o Job 07 realinha o role a ela)
#    POSTGRES_SUPERUSER_PASSWORD  senha do usuario postgres (servidor 05 e Job 07; a API a ignora).
#                                 O PostgreSQL so le POSTGRES_PASSWORD na PRIMEIRA inicializacao do
#                                 volume: para trocar depois use o 06 --trocar-superusuario.
#    APP_JWT_SECRET               segredo do JWT (>= 32 caracteres). Trocar derruba as sessoes.
#    APP_ADMIN_PASSWORD           senha inicial do administrador (so vale com o banco sem usuarios).
#                                 Padrao do 07: "chirpstack" (e-mail admin@chirpstack.com.br); a API
#                                 obriga a troca no primeiro acesso.
#    APP_CHAVE_CIFRAGEM           chave AES-256 que cifra os segredos do Google Drive e a senha
#                                 de app do e-mail no banco.
#                                 NAO troque depois de cadastrar: o que foi cifrado fica ilegivel.
#    CHIRPSTACK_API_TOKEN         API key ADMIN do ChirpStack v4 (GitHub Secret
#                                 CHIRPSTACK_MANAGER_API_TOKEN no pipeline). Sem ela a API sobe,
#                                 mas recusa as chamadas ao ChirpStack.
#    MQTT_USERNAME / MQTT_PASSWORD  usuario do broker MQTT do ChirpStack v4, copiado do Secret
#                                 chirpstack-v4-mqtt-credentials (namespace chirpstack-v4) pelo 07.
#                                 Sem ele a API sobe, mas o monitoramento nao recebe eventos.
#    GOOGLE_DRIVE_CLIENT_ID       (opcional) cliente OAuth do Backup -> Google Drive
#    GOOGLE_DRIVE_CLIENT_SECRET   (opcional)
#
#  O 07 tambem copia a CA do broker para o Secret api-chirpstack-manager-mqtt-ca (chave ca.crt),
#  montado em /etc/chirpstack-manager/mqtt.
#
#  E o secret de pull de imagens do OCI Registry, que e por namespace:
#
#    kubectl -n chirpstack-manager create secret docker-registry oci-registry-secret \
#      --docker-server=gru.ocir.io \
#      --docker-username='<namespace>/<email>' \
#      --docker-password='<auth_token>' \
#      --docker-email='<email>'
# ==============================================================================

# apiVersion: v1
# kind: Secret
# metadata:
#   name: api-chirpstack-manager-secret
#   namespace: chirpstack-manager
# type: Opaque
# stringData:
#   POSTGRESQL_PASSWORD: "<TROCAR>"
#   POSTGRES_SUPERUSER_PASSWORD: "<TROCAR>"
#   APP_JWT_SECRET: "<TROCAR-64-caracteres>"
#   APP_ADMIN_PASSWORD: "chirpstack"
#   APP_CHAVE_CIFRAGEM: "<TROCAR-openssl-rand-base64-32>"
#   CHIRPSTACK_API_TOKEN: "<API key ADMIN do ChirpStack v4>"
#   MQTT_USERNAME: "<copiado do ChirpStack v4>"
#   MQTT_PASSWORD: "<copiado do ChirpStack v4>"
#   GOOGLE_DRIVE_CLIENT_ID: "<OPCIONAL>"
#   GOOGLE_DRIVE_CLIENT_SECRET: "<OPCIONAL>"
