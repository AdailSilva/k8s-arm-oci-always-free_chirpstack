apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ==========================================================================
#  O ArgoCD (Application chirpstack-meshcentral) renderiza SOMENTE o que está em
#  resources: abaixo. Namespace, StorageClass/PV/PVC, Secret, Service e
#  Ingress são aplicados pelo pipeline (passo "Aplicar infraestrutura base")
#  ou pelo 00.UsefulScripts/01.deploy_full_chirpstack-meshcentral_script.sh.
# ==========================================================================
resources:
  - 03.chirpstack-meshcentral__ConfigMap.yaml
  - 04.chirpstack-meshcentral__Deployment.yaml

# --- Pin de versão (ÚNICO lugar para atualizar o MeshCentral / fazer rollback) ---
# Tags em https://github.com/Ylianst/MeshCentral/pkgs/container/meshcentral
images:
  - name: ghcr.io/ylianst/meshcentral
    newTag: "1.3.1"
