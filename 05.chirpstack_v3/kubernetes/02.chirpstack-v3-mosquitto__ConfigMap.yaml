---

apiVersion: v1
kind: ConfigMap
metadata:
  name: chirpstack-v3-mosquitto-config-map
  namespace: chirpstack-v3
  labels:
    app: chirpstack-v3-mosquitto-config-map
data:
  mosquitto.conf: |-
    # Listener MQTT sem TLS (Service :1888 -> 1883; exposto no NLB pela porta 1888).
    listener 1883

    # Acesso só com usuário e senha: a porta 1888 é pública na internet.
    allow_anonymous false

    # Arquivo de senhas: Secret chirpstack-v3-mosquitto-auth (chave passwd), copiado pelo initContainer
    # do 03.chirpstack-v3-mosquitto__Deployment.yaml. Criado/trocado pelo
    # 00.UsefulScripts/09.criar_secrets_chirpstack-v3_script.sh (nunca no Git).
    password_file /mosquitto/auth/passwd
